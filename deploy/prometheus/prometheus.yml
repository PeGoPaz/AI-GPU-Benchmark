# Scrapes a gpu-bench run started with --metrics-port 9400. Run on the host,
# it is reached through host.docker.internal (docker-compose.yml maps it on
# Linux too); run as the compose stack's `bench` service, by that name. Both
# targets are listed, and whichever is not running simply shows as down.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gpu-bench
    static_configs:
      - targets:
          - host.docker.internal:9400
          - bench:9400
