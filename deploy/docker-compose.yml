# Prometheus and Grafana for watching a run live:
#
#   gpu-bench --headless --preset stress --metrics-port 9400 --metrics-host 0.0.0.0
#   docker compose -f deploy/docker-compose.yml up -d
#
# then open http://localhost:3000 (the dashboard is provisioned; anonymous
# viewing is on, and admin/admin signs in to edit). Both ports are bound to
# localhost only: nothing here is meant to be reachable from the network.
#
# Or run the benchmark in a container as well, built from the Dockerfile:
#
#   docker compose -f deploy/docker-compose.yml --profile bench up --build
name: gpu-bench

services:
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # host.docker.internal is built into Docker Desktop; this adds it on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gpu-bench.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  bench:
    profiles: [bench]
    build:
      context: ..
    image: gpu-bench
    command: ["--preset", "standard", "--metrics-port", "9400", "--metrics-host", "0.0.0.0"]
    volumes:
      # The container runs as uid 1000; on a host where that is not you,
      # create logs/ writable for it first.
      - ../logs:/home/bench/logs
      - hf-cache:/home/bench/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
