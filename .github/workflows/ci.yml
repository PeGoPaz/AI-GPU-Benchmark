name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned: Ruff's default rule set changes between releases, so an
      # unpinned version could fail CI without any code change.
      # Keep this version in sync with requirements-dev.txt.
      - run: pip install ruff==0.16.5

      - name: Lint
        run: ruff check --output-format=github .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # PyQt6 comes along for its bundled .pyi stubs: without them every
      # signal and slot is Any and the check loses most of its point. Pinned
      # via requirements-dev.txt, for the same reason ruff is pinned.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Settings live in mypy.ini, so this needs no arguments.
      - name: Type check
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          # The whole suite on Windows too: paths, encodings, file locking
          # and Qt's platform plugin all differ there.
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately not requirements.txt: torch and the HF stack are mocked
      # in tests, and pulling them would add gigabytes for no extra coverage.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # PyQt6 needs these even with the offscreen platform plugin. Windows
      # and macOS ship what it needs.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Check every file parses
        run: python -m compileall -q main.py gpu_bench tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          HYPOTHESIS_PROFILE: ci
        run: pytest -v

      # The installed package, not the checkout: catches a module or the
      # icon missing from the wheel, which the tests above cannot see.
      # --no-deps because the ML stack is deliberately absent here.
      - name: Install the package
        run: pip install --no-deps .

      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        run: |
          gpu-bench --version
          gpu-bench --list
          python -c "import os, gpu_bench.ui.about as about; assert os.path.isfile(about.ICON_PATH), about.ICON_PATH"

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is where the GPU runs, macOS where development happens, and
        # Windows where most consumer NVIDIA cards are.
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Ninja needs the MSVC environment on Windows; the default Visual
          # Studio generator finds the compiler by itself.
          - generator: "-G Ninja"
          - os: windows-latest
            generator: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # From pip on both runners, so the versions match instead of being
      # whatever each image happens to ship.
      - name: Install build tools
        run: pip install cmake ninja

      - name: Configure
        run: >
          cmake -S native -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Debug
          -DPOWER_BUILD_PYTHON=OFF -DPOWER_WARNINGS_AS_ERRORS=ON

      # --config / -C are what a multi-config generator (Visual Studio) needs,
      # and are ignored by the single-config ones.
      - name: Build
        run: cmake --build build --config Debug

      - name: C++ tests
        run: ctest --test-dir build -C Debug --output-on-failure

      # Warnings as errors here too: the bindings are only compiled by
      # this build, never by the C++-only one above.
      - name: Build and install the Python module
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ./native -C cmake.define.POWER_WARNINGS_AS_ERRORS=ON

      - name: Python tests against the module
        run: pytest -v tests/test_native_sampler.py

      # A short run, only to keep the script working; the numbers on a
      # shared runner mean little.
      - name: Sampler benchmark (smoke)
        run: python native/bench/sampler_bench.py --seconds 0.5

  native-sanitizers:
    name: Native sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Separate builds: ThreadSanitizer cannot be combined with the others.
        sanitize: ["address,undefined", "thread"]

    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 randomises mmap with more bits than ThreadSanitizer's
      # shadow memory layout tolerates, and it aborts with "unexpected memory
      # mapping" before running a single test.
      - name: Make ASLR compatible with ThreadSanitizer
        if: matrix.sanitize == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Debug
          -DPOWER_BUILD_PYTHON=OFF -DPOWER_WARNINGS_AS_ERRORS=ON
          -DPOWER_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j 4

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

  native-format:
    name: Format (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned for the same reason as ruff: formatting rules change between
      # releases. Keep in sync with requirements-dev.txt.
      - run: pip install clang-format==23.1.3

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files 'native/*.cpp' 'native/*.hpp')
