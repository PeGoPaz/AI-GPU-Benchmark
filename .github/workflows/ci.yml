name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned: Ruff's default rule set changes between releases, so an
      # unpinned version could fail CI without any code change.
      # Keep this version in sync with requirements-dev.txt.
      - run: pip install ruff==0.16.5

      - name: Lint
        run: ruff check --output-format=github .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # PyQt6 comes along for its bundled .pyi stubs: without them every
      # signal and slot is Any and the check loses most of its point. Pinned
      # via requirements-dev.txt, for the same reason ruff is pinned.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Settings live in mypy.ini, so this needs no arguments.
      - name: Type check
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately not requirements.txt: torch and the HF stack are mocked
      # in tests, and pulling them would add gigabytes for no extra coverage.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # PyQt6 needs these even with the offscreen platform plugin.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Check every file parses
        run: python -m compileall -q main.py app tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest -v
