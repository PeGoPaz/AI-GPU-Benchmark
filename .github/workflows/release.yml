name: Release

# Pushing a version tag publishes a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag has to match gpu_bench.__version__ and CHANGELOG.md has to have a
# section for it, whose text becomes the release notes. The release carries
# the app's wheel and sdist and the native module's wheels for Linux and
# Windows, and the container image goes to the GitHub Container Registry.
#
# Run by hand from the Actions tab, it builds and checks all of it and
# publishes nothing: a dry run before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the version and the changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Version matches the tag
        id: version
        run: |
          version=$(python -c "import gpu_bench; print(gpu_bench.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match gpu_bench.__version__ $version"
            exit 1
          fi

      # The section between "## [<version>]" and the next "## [" heading,
      # without the link definitions that close the file.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ ! -s notes.md ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for $VERSION (fine for a dry run)"
            echo "Dry run of $VERSION." > notes.md
          fi
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  app:
    name: App wheel and sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build==1.5.0
          python -m build --outdir dist .

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/*
          if-no-files-found: error

  wheels:
    needs: check
    uses: ./.github/workflows/wheels.yml

  image:
    needs: check
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: ${{ github.ref_type == 'tag' }}
      version: ${{ needs.check.outputs.version }}

  publish:
    name: Publish the GitHub release
    needs: [check, app, wheels, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "AI GPU Benchmark $VERSION" \
            --notes-file artifacts/notes/notes.md \
            artifacts/app/* artifacts/wheels-*/*.whl
