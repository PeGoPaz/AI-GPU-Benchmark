name: Wheels

# Prebuilt wheels of the native module, so neither a cloud GPU box nor a
# gaming PC needs a compiler: Linux (manylinux) and Windows, the two
# platforms with NVML, for every Python version CI tests. Each wheel is
# installed into a clean environment and the module's tests run against it
# before it is kept. The release calls this and attaches the wheels.
on:
  push:
    branches: ["**"]
    paths:
      - native/**
      - tests/test_native_sampler.py
      - .github/workflows/wheels.yml
  pull_request:
    paths:
      - native/**
      - tests/test_native_sampler.py
      - .github/workflows/wheels.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned, like every other tool here: a new release can change which
      # images and interpreters a build uses.
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build and test the wheels
        run: python -m cibuildwheel native --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          # tests/conftest.py needs Hypothesis; the native tests need nothing
          # else beyond the wheel and numpy, and no GPU — they script NVML.
          CIBW_TEST_REQUIRES: pytest hypothesis numpy
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/test_native_sampler.py -p no:cacheprovider -o addopts=-q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
