name: Image

# Builds the container image and checks it starts, whenever something that
# goes into it changes; the release calls it with push: true to publish it.
# Every branch, so one carrying image changes is checked too; but no tags,
# which skip path filters entirely — the release builds the image itself.
on:
  push:
    branches: ["**"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - gpu_bench/**
      - native/**
      - deploy/**
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - gpu_bench/**
      - native/**
      - deploy/**
      - .github/workflows/image.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      push:
        description: Push the image to the GitHub Container Registry
        type: boolean
        default: false
      version:
        description: Version tag for the pushed image, e.g. 0.1.0
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The PyTorch CUDA base image and the build unpack to some 15 GB.
      # Current runners have far more free, and deleting toolchains to make
      # room takes minutes — so only when a runner is short of space.
      - name: Free disk space if needed
        run: |
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "$free_gb GB free"
          if [ "$free_gb" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            docker system prune -af
            df -h /
          fi

      - name: Build
        run: docker build --tag gpu-bench:ci .

      # No GPU on the runner: this proves the image starts, imports every
      # headless module and the native sampler, and parses its arguments.
      - name: Smoke test
        run: |
          docker run --rm gpu-bench:ci --version
          docker run --rm gpu-bench:ci --list
          docker run --rm --entrypoint python gpu-bench:ci -c "
          import gpu_bench.batch, gpu_bench.cli, gpu_bench.utils.html_report
          import gpu_bench.utils.prometheus, gpu_bench.utils.sweep_report
          import nvml_sampler
          print('native sampler', nvml_sampler.__version__, nvml_sampler.available())
          "
          docker run --rm --entrypoint id gpu-bench:ci -u | grep -qx 1000

      - name: Validate the compose stack
        run: docker compose -f deploy/docker-compose.yml --profile bench config --quiet

      - name: Push to the GitHub Container Registry
        if: inputs.push
        env:
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-gpu-benchmark"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag gpu-bench:ci "$image:$tag"
            docker push "$image:$tag"
          done
