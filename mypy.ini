# Mypy configuration for AI-GPU-Benchmark.
#
# Being tightened a package at a time: gpu_bench.core and gpu_bench.utils
# are checked strictly (the section at the end), the UI and the CLI only for
# signal/slot and API misuse so far. See CONTRIBUTING.md.

[mypy]
files = main.py, gpu_bench

# No python_version pin: it would make mypy parse the bundled numpy stubs as
# 3.10, and those use 3.12+ syntax. The 3.10 floor is enforced where it
# actually bites — ruff's target-version, and CI running the suite on 3.10.

# torch, transformers, peft and datasets ship no usable stubs, and installing
# them in CI would add gigabytes for nothing. PyQt6 brings its own .pyi files,
# so the signal/slot checking that motivates this still works.
ignore_missing_imports = True

# Real mistakes rather than missing annotations.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Strict where the annotations are complete. --strict itself is global-only,
# so these are its component flags; the UI and the CLI are not there yet.
[mypy-gpu_bench.core.*,gpu_bench.utils.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
disallow_subclassing_any = True
check_untyped_defs = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
