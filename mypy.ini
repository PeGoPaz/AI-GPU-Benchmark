# Mypy configuration for AI-GPU-Benchmark.
#
# Deliberately not strict. The point is catching signal/slot and API misuse,
# not annotating every function: --disallow-untyped-defs currently reports 33
# missing annotations and --strict reports 64, almost all of them mechanical.
# Tightening is a separate piece of work — see CONTRIBUTING.md.

[mypy]
files = main.py, app

# No python_version pin: it would make mypy parse the bundled numpy stubs as
# 3.10, and those use 3.12+ syntax. The 3.10 floor is enforced where it
# actually bites — ruff's target-version, and CI running the suite on 3.10.

# torch, transformers, peft and datasets ship no usable stubs, and installing
# them in CI would add gigabytes for nothing. PyQt6 brings its own .pyi files,
# so the signal/slot checking that motivates this still works.
ignore_missing_imports = True

# Real mistakes rather than missing annotations.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
