# Ruff configuration for AI-GPU-Benchmark.
#
# The rule set is pinned explicitly rather than relying on Ruff's defaults,
# which change between releases — otherwise a Ruff upgrade could turn CI red
# without a single line of project code changing.

target-version = "py310"
line-length = 100

exclude = ["venv", ".venv", "results", "logs"]

[lint]
# E/W  pycodestyle   F  pyflakes (real errors: undefined names, unused imports)
# I    isort         B  bugbear   UP  pyupgrade   C4  comprehensions
select = ["E", "W", "F", "I", "B", "UP", "C4"]

ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[lint.per-file-ignores]
# Tests mock heavily and poke at internals on purpose.
"tests/*" = ["E402", "B011"]

[lint.isort]
known-first-party = ["app"]
